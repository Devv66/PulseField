name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Install Firebase emulator test tooling
        run: npm install --no-save firebase-tools @firebase/rules-unit-testing@5 @firebase/app-compat @firebase/firestore-compat --legacy-peer-deps
      - name: Run Firestore rules tests in emulator
        run: npx firebase emulators:exec --only firestore --project demo-pulsefield-rules "node --test tests/firestore.rules.test.mjs"
      - name: Run application tests and production build
        run: npm run check
